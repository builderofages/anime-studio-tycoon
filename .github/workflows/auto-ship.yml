name: Branch and PR checks

# Review-only checks. Never merge, delete a branch, or publish a deployment.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: branch-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Game and purchase regressions
        run: npm test
      - name: Install local ledger test runtime
        run: sudo apt-get update && sudo apt-get install -y redis-server redis-tools
      - name: Durable purchase ledger integration tests
        run: node scripts/purchase-ledger-test.mjs
      - name: Dependency audit
        run: npm run audit:check
